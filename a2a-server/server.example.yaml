# A2A Server config. All durations are seconds. Copy to server.yaml and edit.
# Tokens and credentials support ${ENV_VAR} expansion.
host: 0.0.0.0
port: 8100
language: zh            # zh | en (add a dict in notify.py MESSAGES for more)
public_base: http://127.0.0.1:8100   # used in notification texts
admin_token: change-me  # read-only admin page access (?token=)
db_path: a2a.db

# One IM per domain: each domain entry may set its own `channel`; owners bind on
# exactly that one. default_channel is the fallback for domains without an
# explicit channel. An adapter registers only when its credentials below are
# complete; an explicitly configured domain channel that is unavailable stops
# the server at startup (fix the creds or the channel, don't boot half-working).
default_channel: log
# feishu:                        # 企业自建应用 (scopes: im:message, contact users/batch_get_id)
#   app_id: cli_xxx
#   app_secret: ${FEISHU_APP_SECRET}
# telegram_bot_token: "123456:ABC-DEF..."   # owners declare their numeric chat id
# slack_bot_token: xoxb-...                  # scopes: chat:write, im:write, users:read.email
# dingtalk:                      # 企业内部应用工作通知 (notify-only, async delivery)
#   app_key: ding_xxx
#   app_secret: ${DINGTALK_APP_SECRET}
#   agent_id: 123456789
# wecom:                         # 企业微信自建应用 (recipient must be in visible range)
#   corp_id: ww_xxx
#   corp_secret: ${WECOM_CORP_SECRET}
#   agent_id: 1000002
# discord_bot_token: ...                     # owners declare their numeric user id (snowflake)

domains:
  - id: team-a
    token: ${A2A_TOKEN_A}
  - id: team-b
    token: ${A2A_TOKEN_B}
    # channel: feishu            # overrides default_channel for this domain

online_timeout: 90
poll_wait: 30              # must stay < 60 (worker HTTP client gives up at 65s)
sweep_interval: 5
dispatch_grace: 60
agent_retention: 259200     # 3d
task_retention: 2592000     # 30d
approval_timeout: 1800      # 30m
input_required_timeout: 86400  # 24h
default_task_timeout: 3600
max_file_mb: 50            # per-file staging cap (uploads over this are refused)
max_files_per_task: 10     # initiator attachments per task (result files bypass)
