# A2A worker config. Copy to worker.yaml and edit.
# Values support ${ENV_VAR} expansion. Ask the owner for agent.owner and the
# notify section — never guess them from the system (whoami etc.).
server_url: http://127.0.0.1:8100
domain: team-a
domain_token: ${A2A_TOKEN_A}

agent:
  id: zhangsan-claude            # unique in domain, one machine per id; {owner}-{tool} is a good pattern
  owner: zhangsan                # told by the owner; multiple agents may share one owner
  description: "Claude Code on zhangsan's workstation"
  accept_policy: notify_run  # auto | notify_run | manual
  accept_from: all           # all | [agent-id, ...]
notify:                      # asked at onboarding: which IM platform + your ID there
  channel: log               # log | feishu | dingtalk | wecom | telegram | slack | discord — must equal the domain's channel
  id_type: text
  id: zhangsan

need_input_marker: '^NEED_INPUT:'   # matched against the END of driver output: print the marker line LAST
workspace_dir: ~/.a2a-worker/tasks
# local_port: 7860           # optional override; default is derived per agent id (no collisions)
busy_poll_interval: 5
driver:                     # the one driver every task runs with; a worker cannot be re-targeted per task
  kind: command             # command (subprocess) | manual (you run it, then `worker.py report`)
  # the full task text is fed via stdin AND written to {task_file};
  # keep argv short ASCII — no prompt content on the command line.
  # Other -p style CLIs: swap the cmd line and set the right output mode, e.g.
  #   cmd: 'codex exec --json -'        output: tail
  cmd: 'claude -p --output-format json --permission-mode acceptEdits'
  timeout: 3600
  output: last_json         # last_json (JSON envelope on stdout) | tail (plain text)
  # manual instead of a CLI: kind: manual, manual_timeout_hours: 24, drop cmd/timeout/output
